<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="420" height="340" fill="#ffffff"/>

  <!-- Class box -->
  <rect x="40" y="20" width="300" height="230" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- Title compartment -->
  <text x="190" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">Student</text>
  <line x1="40" y1="60" x2="340" y2="60" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- Attributes compartment -->
  <text x="56" y="82" font-size="13" font-family="Consolas, monospace" fill="#1f2937">- studentId : String</text>
  <text x="56" y="104" font-size="13" font-family="Consolas, monospace" fill="#1f2937">- fullName : String</text>
  <text x="56" y="126" font-size="13" font-family="Consolas, monospace" fill="#1f2937">- averageScore : float</text>
  <line x1="40" y1="140" x2="340" y2="140" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- Methods compartment -->
  <text x="56" y="168" font-size="13" font-family="Consolas, monospace" fill="#1f2937">+ getScore() : float</text>
  <text x="56" y="196" font-size="13" font-family="Consolas, monospace" fill="#1f2937">+ setScore(float score) : void</text>

  <text x="190" y="285" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">[Sơ đồ minh họa — đã bổ sung Bổ từ truy cập]</text>

  <!-- Legend -->
  <text x="40" y="315" font-size="11" fill="#374151">— : Private (đóng gói dữ liệu, chỉ nội bộ Lớp truy cập)</text>
  <text x="40" y="330" font-size="11" fill="#374151">+ : Public (kênh giao tiếp hợp lệ ra bên ngoài)</text>
</svg>
